<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f2c5c">
    <title>Offline | SI-Logistik</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: #f4f7fb; color: #172b4d; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
        main { width: min(100%, 28rem); padding: 2rem; border: 1px solid #dfe6f0; border-radius: 1rem; background: #fff; box-shadow: 0 .5rem 2rem #0f2c5c12; }
        img { width: 6rem; height: 6rem; object-fit: contain; }
        h1 { margin: 1rem 0 .5rem; font-size: 1.5rem; }
        p { color: #52627a; }
        button { padding: .7rem 1rem; border: 0; border-radius: .5rem; background: #0f2c5c; color: #fff; font: inherit; cursor: pointer; }
    </style>
</head>
<body><main>
    <img src="/images/logo-sekolah.png" alt="Logo SMA Taruna Nusantara IKN">
    <h1>Anda sedang offline</h1>
    <p>SI-Logistik memerlukan koneksi internet untuk membuka data dan transaksi. Sambungkan kembali ke internet, lalu coba lagi.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
</main></body>
</html>
